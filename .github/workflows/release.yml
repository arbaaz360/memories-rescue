# Release: on a version tag (v1.0.0, v1.1.0-beta.1) build Windows x64 (NSIS +
# MSI) and macOS universal (DMG), sign and notarize when the secrets exist,
# produce updater artifacts and latest.json, and leave a DRAFT release on the
# public releases repository. The owner checks it and runs
# `python tools/release/publish.py <tag>`, which publishes it and rewrites
# `latest-beta.json` on the fixed `channel-beta` release (GitHub's
# /releases/latest/ never resolves to a prerelease, so the beta feed cannot
# live on the prerelease itself).
#
# Secrets (all optional except RELEASES_TOKEN; docs/release/README.md says
# where each comes from and what happens without it):
#   RELEASES_TOKEN                         fine-grained token, contents: write on arbaaz360/memories-rescue-releases
#   TAURI_SIGNING_PRIVATE_KEY              updater signing key, TAURI_SIGNING_PRIVATE_KEY_PASSWORD its password
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_TEAM_ID
#   APPLE_API_ISSUER, APPLE_API_KEY, APPLE_API_KEY_CONTENT      notarytool (App Store Connect API key)
#   ESIGNER_USERNAME, ESIGNER_PASSWORD, ESIGNER_CREDENTIAL_ID, ESIGNER_TOTP_SECRET   SSL.com eSigner (primary)
#   AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET,
#   TRUSTED_SIGNING_ENDPOINT, TRUSTED_SIGNING_ACCOUNT, TRUSTED_SIGNING_PROFILE   Azure Trusted Signing (alternative)
#
# Without signing secrets the build still runs and the release is labelled
# "unsigned build"; without a pinned minimal ffmpeg the Windows build can use
# the development ffmpeg only when dispatched by hand with allow_dev_ffmpeg.
#
# Supply chain: every third-party action is pinned by commit SHA (tag in the
# comment), the two signing tools are pinned by version and hash, and this
# workflow has no pull_request trigger, so secrets never meet unreviewed code.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish, e.g. v1.0.0"
        required: true
        type: string
      allow_dev_ffmpeg:
        description: "Windows only: stage the BtbN development ffmpeg when no minimal build is pinned (labelled, not for publishing)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASES_REPO: arbaaz360/memories-rescue-releases
  TAG: ${{ inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Checklist
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      notes: ${{ steps.meta.outputs.notes }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.TAG }}

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Node 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: npm ci
        run: npm ci

      # Versions agree, the changelog has the entry, the notices are current,
      # the release overlay parses (SRS 10.5).
      - name: Release checklist
        run: python tools/release/check.py --tag "$TAG"

      - name: Version, channel and release notes
        id: meta
        run: |
          version=$(python -c "import json; print(json.load(open('package.json'))['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "notes<<MR_NOTES_EOF"
            python tools/release/release_notes.py "$version"
            echo "MR_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            tauri_args: ""
            bundle_dir: target/release/bundle
          - name: macOS universal
            os: macos-latest
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri_args: "--target universal-apple-darwin"
            bundle_dir: target/universal-apple-darwin/release/bundle
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.TAG }}

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-${{ matrix.target }}

      - name: Node 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: npm ci
        run: npm ci

      # The minimal LGPL ffmpeg pinned in tools/release/sidecars.lock.json,
      # fetched from the sidecar release of the releases repository and
      # verified by SHA-256; sets MR_FFMPEG_KIND.
      - name: Stage sidecars
        shell: bash
        run: |
          extra=""
          if [[ "${{ inputs.allow_dev_ffmpeg }}" == "true" ]]; then extra="--allow-dev"; fi
          python tools/release/stage_sidecars.py --target "${{ matrix.target }}" $extra

      # Which signing path this runner can take, from which secrets exist.
      - name: Decide signing
        shell: bash
        env:
          ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
          TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          signed=true
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            if [[ -n "$ESIGNER_USERNAME" ]]; then
              echo "WINDOWS_SIGNER=esigner" >> "$GITHUB_ENV"
            elif [[ -n "$TRUSTED_SIGNING_ENDPOINT" ]]; then
              echo "WINDOWS_SIGNER=azure" >> "$GITHUB_ENV"
            else
              echo "WINDOWS_SIGNER=none" >> "$GITHUB_ENV"
              signed=false
            fi
          else
            if [[ -z "$APPLE_CERTIFICATE" ]]; then signed=false; fi
          fi
          echo "MR_RELEASE_SIGNED=$signed" >> "$GITHUB_ENV"
          echo "signing: $signed"

      # Pinned release of SSL.com's CodeSignTool (the platform-independent
      # archive: jar + conf, run with the runner's Java), verified by SHA-256
      # before anything in it is used. Bump: new tag, new hash from a local
      # download (sha256sum CodeSignTool-vX.Y.Z.zip).
      - name: Install CodeSignTool (SSL.com eSigner)
        if: runner.os == 'Windows' && env.WINDOWS_SIGNER == 'esigner'
        shell: pwsh
        env:
          CST_VERSION: "1.3.2"
          CST_SHA256: "f14b1e1ef14bfa1fd00279c363aab0debbf5dcfba0e4bcdce5d22bb771de0e3a"
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "CodeSignTool-v$env:CST_VERSION.zip"
          Invoke-WebRequest -Uri "https://github.com/SSLcom/CodeSignTool/releases/download/v$env:CST_VERSION/CodeSignTool-v$env:CST_VERSION.zip" -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLowerInvariant()
          if ($actual -ne $env:CST_SHA256) { throw "CodeSignTool-v$env:CST_VERSION.zip: sha256 $actual does not match the pinned $env:CST_SHA256" }
          $dir = Join-Path $env:RUNNER_TEMP "CodeSignTool"
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $jar = Get-ChildItem -Path $dir -Filter "code_sign_tool-*.jar" -Recurse | Select-Object -First 1
          if (-not $jar) { throw "code_sign_tool jar not found in the archive" }
          "CODESIGNTOOL_DIR=$($jar.Directory.Parent.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          java -version

      # Pinned Microsoft.Trusted.Signing.Client package, fetched from the
      # NuGet flat container and checked against its catalogue SHA-512
      # (base64, as NuGet publishes it) before extraction. Bump: new version,
      # new hash from the catalogue entry or a local download.
      - name: Install Trusted Signing client (Azure)
        if: runner.os == 'Windows' && env.WINDOWS_SIGNER == 'azure'
        shell: pwsh
        env:
          TSC_VERSION: "1.0.95"
          TSC_SHA512_BASE64: "uTRnbWSg1agZUh8J5bqJXhJr4LZ9dzs6Xy9PNxK4yA9ubpGuPq71bz1AZMmiKs/HVbQc3NUChtGMVexqmuV+kA=="
        run: |
          $pkg = Join-Path $env:RUNNER_TEMP "microsoft.trusted.signing.client.$env:TSC_VERSION.zip"
          Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/microsoft.trusted.signing.client/$env:TSC_VERSION/microsoft.trusted.signing.client.$env:TSC_VERSION.nupkg" -OutFile $pkg
          $actual = [Convert]::ToBase64String([System.Security.Cryptography.SHA512]::Create().ComputeHash([System.IO.File]::ReadAllBytes($pkg)))
          if ($actual -ne $env:TSC_SHA512_BASE64) { throw "Microsoft.Trusted.Signing.Client $env:TSC_VERSION: sha512 does not match the pinned value" }
          $out = Join-Path $env:RUNNER_TEMP "tsc"
          Expand-Archive -Path $pkg -DestinationPath $out -Force
          $dlib = Join-Path $out "bin\x64\Azure.CodeSigning.Dlib.dll"
          if (-not (Test-Path $dlib)) { throw "Azure.CodeSigning.Dlib.dll not found in the package" }
          "TRUSTED_SIGNING_DLIB=$dlib" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # notarytool wants the App Store Connect key as a file.
      - name: Apple API key file
        if: runner.os == 'macOS' && env.MR_RELEASE_SIGNED == 'true'
        shell: bash
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          if [[ -n "$APPLE_API_KEY_CONTENT" ]]; then
            printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          fi

      # tauri-action: npm run tauri build (frontend via beforeBuildCommand),
      # signs the app and every externalBin, notarizes and staples on macOS,
      # signs updater artifacts, and uploads everything plus latest.json to a
      # draft release on the releases repository.
      - name: Build, sign and upload
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
          ESIGNER_PASSWORD: ${{ secrets.ESIGNER_PASSWORD }}
          ESIGNER_CREDENTIAL_ID: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
          ESIGNER_TOTP_SECRET: ${{ secrets.ESIGNER_TOTP_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          TRUSTED_SIGNING_PROFILE: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
        with:
          owner: arbaaz360
          repo: memories-rescue-releases
          tagName: ${{ env.TAG }}
          releaseName: Memories Rescue ${{ needs.checks.outputs.version }}
          releaseBody: ${{ needs.checks.outputs.notes }}
          releaseDraft: true
          prerelease: ${{ needs.checks.outputs.prerelease == 'true' }}
          releaseCommitish: main
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          tauriScript: npm run tauri
          args: --config src-tauri/tauri.release.conf.json ${{ matrix.tauri_args }}

      - name: Post-build checks
        shell: bash
        run: python tools/release/check.py --bundles --bundle-dir "${{ matrix.bundle_dir }}"

      - name: Build record
        shell: bash
        run: |
          mkdir -p build-info
          python - <<'PY'
          import json, os
          json.dump({
              "target": os.environ["MATRIX_TARGET"],
              "signed": os.environ.get("MR_RELEASE_SIGNED", "false") == "true",
              "ffmpeg_kind": os.environ.get("MR_FFMPEG_KIND", "unknown"),
              "ffmpeg_version": os.environ.get("MR_FFMPEG_VERSION", ""),
          }, open(f"build-info/{os.environ['MATRIX_TARGET']}.json", "w"), indent=2)
          PY
        env:
          MATRIX_TARGET: ${{ matrix.target }}

      - name: Upload build record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-info-${{ matrix.target }}
          path: build-info/

      - name: Upload bundles (for inspection)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bundles-${{ matrix.target }}
          path: |
            ${{ matrix.bundle_dir }}/nsis/*
            ${{ matrix.bundle_dir }}/msi/*
            ${{ matrix.bundle_dir }}/dmg/*.dmg
            ${{ matrix.bundle_dir }}/macos/*.tar.gz
            ${{ matrix.bundle_dir }}/macos/*.sig
          if-no-files-found: error

  publish:
    name: Finish draft release
    needs: [checks, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: build-info-*
          path: build-info
          merge-multiple: true

      # SHA256SUMS.txt, the ffmpeg source bundle, and the "unsigned build"
      # label when it applies. The release stays a draft.
      - name: Checksums, updater channel, labels
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          python tools/release/finish_release.py \
            --repo "$RELEASES_REPO" --tag "$TAG" \
            --prerelease "${{ needs.checks.outputs.prerelease }}" \
            --build-info "build-info/*.json"
