name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Pillow and tzdata
        run: python -m pip install --upgrade pip pillow tzdata

      - name: Generate fixtures
        run: python tools/make_fixture --all

      # The runners have neither ffmpeg nor exiftool and the binaries are not
      # committed. tauri-build fails on a missing `bundle.externalBin` file, so
      # empty placeholders stand in; the sidecar tests see them and skip.
      - name: Sidecar placeholders
        run: python tools/sidecars.py placeholders

      - name: npm ci
        run: npm ci

      # src-tauri embeds dist/ at compile time (tauri::generate_context!), so
      # the frontend must be built before any cargo command touches the shell.
      - name: Frontend build
        run: npm run build

      # Vitest: formatting, the screen flow, backend selection, the mock
      # engine, catalogue completeness and contract-document sync.
      - name: Frontend tests
        run: npm test

      # SRS 10.5 pre-build items: one version everywhere, changelog entry,
      # THIRD_PARTY_NOTICES.md regenerated (tools/release/notices.py --check),
      # release config overlay parses.
      - name: Release checklist
        run: python tools/release/check.py

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  workflows:
    name: workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Static check of every workflow (expressions, inputs, shell scripts).
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
