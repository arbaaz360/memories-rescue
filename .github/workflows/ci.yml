name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Third-party actions are pinned by commit SHA (the tag is in the comment);
# bump by resolving the new tag with `gh api repos/<owner>/<repo>/git/ref/tags/<tag>`.
jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Node 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Pillow and tzdata
        run: python -m pip install --upgrade pip pillow tzdata

      - name: Generate fixtures
        run: python tools/make_fixture --all

      # The runners have neither ffmpeg nor exiftool and the binaries are not
      # committed. tauri-build fails on a missing `bundle.externalBin` file, so
      # empty placeholders stand in; the sidecar tests see them and skip.
      - name: Sidecar placeholders
        run: python tools/sidecars.py placeholders

      - name: npm ci
        run: npm ci

      # src-tauri embeds dist/ at compile time (tauri::generate_context!), so
      # the frontend must be built before any cargo command touches the shell.
      - name: Frontend build
        run: npm run build

      # Vitest: formatting, the screen flow, backend selection, the mock
      # engine, catalogue completeness and contract-document sync.
      - name: Frontend tests
        run: npm test

      # SRS 10.5 pre-build items: one version everywhere, changelog entry,
      # THIRD_PARTY_NOTICES.md regenerated (tools/release/notices.py --check),
      # release config overlay parses.
      - name: Release checklist
        run: python tools/release/check.py

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  workflows:
    name: workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Static check of every workflow (expressions, inputs, shell scripts).
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color
