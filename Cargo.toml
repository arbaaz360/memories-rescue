[workspace]
resolver = "3"
members = ["crates/mr-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["NovaByteWorks"]
repository = "https://github.com/arbaaz360/memories-rescue"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "alloc"] }
thiserror = "2"
proptest = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
