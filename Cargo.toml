[workspace]
resolver = "3"
members = ["crates/mr-cli", "crates/mr-composite", "crates/mr-core", "crates/mr-job", "crates/mr-meta", "crates/mr-report", "crates/mr-tz", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["NovaByteWorks"]
repository = "https://github.com/arbaaz360/memories-rescue"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "alloc"] }
thiserror = "2"
proptest = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
flate2 = "1"
crc32fast = "1"
clap = { version = "4", features = ["derive"] }
# FR-41: the engine emits events; the app installs the subscriber.
tracing = { version = "0.1.44", default-features = false, features = ["std"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# "unwind", not "abort": the engine catches a panic per item (a bad file
# fails that item), which "abort" would turn into a crash on every resume.
panic = "unwind"
strip = true
