[package]
name = "memories-rescue"
description = "Repairs a Snapchat Memories export on your own computer"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name,
# which matters on Windows (https://github.com/rust-lang/cargo/issues/8519).
name = "memories_rescue_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde.workspace = true
# No asset protocol: the window loads no file from disk (thumbnails are data:
# URLs made by the engine), so a picker or a drop cannot widen what it reads.
tauri = { version = "2", features = [] }
# In-memory preview thumbnails (already in the tree through mr-composite).
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
base64 = "0.22"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde_json.workspace = true
chrono = { workspace = true, features = ["clock"] }
mr-core = { path = "../crates/mr-core" }
mr-job = { path = "../crates/mr-job" }
mr-report = { path = "../crates/mr-report" }
# Q-04: the app sets the encoder options (software h264_mf, 1.3x bitrate).
mr-composite = { path = "../crates/mr-composite" }
# FR-41: the rotating, redacted log; mr-composite's `log` records join it.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry", "std", "tracing-log"] }
regex.workspace = true
# §10.2: signed updates from the releases repository (Rust side only; the window has no updater permission).
# No `zip` feature: Tauri 2 installs the signed NSIS .exe directly; zipped bundles were v1 only.
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["native-tls", "system-proxy"] }
uuid = { version = "1", features = ["v4"] }
fs4 = "1"
iana-time-zone = "0.1"
sha2 = "0.11"
zip.workspace = true
# Licence checks with Gumroad (SRS 9); reqwest is already in the tree through tauri.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "blocking", "form", "json"] }
# OS keychain for the licence key and the per-install secret (NFR-PRV-05).
keyring = "4"

[dev-dependencies]
zip.workspace = true
